<!doctype html>

    <meta charset="UTF-8" />

    <title>Davar | Hebrew Scriptures Bible Study App</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./public/favicon.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./public/apple-touch-icon.png"
    />
    <script>
      (function () {
        const selectors = [
          'link[rel="icon"]',
          'link[rel="shortcut icon"]',
          'link[rel="apple-touch-icon"]',
        ];

        const normalizeIconHref = (rawHref) => {
          if (!rawHref || /^(https?:|data:|blob:|\/)/i.test(rawHref)) {
            return rawHref;
          }

          let normalized = rawHref.replace(/^\.\//, "");
          normalized = normalized.replace(/^public\//, "");
          return `/${normalized}`;
        };

        selectors.forEach((selector) => {
          document.querySelectorAll(selector).forEach((link) => {
            const rawHref = link.getAttribute("href");
            const nextHref = normalizeIconHref(rawHref);
            if (nextHref && nextHref !== rawHref) {
              link.setAttribute("href", nextHref);
            }
          });
        });
      })();
    </script>

    <!-- Language Detection and Dynamic Meta Tag Setting -->
    <script>
      (function () {
        // Get user's preferred language
        const userLang = navigator.language;
        const primaryLang = userLang.split("-")[0];

        // Define descriptions by language
        const descriptions = {
          es: "Lee las Escrituras Hebreas con traducciones confiables y herramientas léxicas en Davar. Empieza gratis en App Store o Google Play hoy.",
          he: "קראו כתבי קודש בעברית עם תרגומים וכלי לקסיקון אמינים בדבר. התחילו בחינם ב-App Store או ב-Google Play היום.",
          en: "Read Hebrew Scriptures with trusted translations, Strong's tools, and Qumran variants in Davar. Start free on App Store or Google Play today.",
        };

        const keywords = {
          en: [
            "Hebrew Bible",
            "Bible study app",
            "Tanakh study",
            "Torah reading",
            "Strong's concordance",
            "Qumran manuscripts",
            "Delitzsch Hebrew New Testament",
            "biblical Hebrew learning",
            "scripture study tools",
            "Davar app",
          ],
          es: [
            "Biblia en Hebreo",
            "Biblia Hebrea",
            "app de estudio bíblico",
            "estudio del Tanaj",
            "lectura de la Torah",
            "concordancia Strong",
            "manuscritos de Qumrán",
            "Nuevo Testamento hebreo Delitzsch",
            "aprender hebreo bíblico",
            "herramientas de estudio bíblico",
            "app Davar",
          ],
          he: [
            "תנ״ך",
            "אפליקציית לימוד מקרא",
            "לימוד תנ״ך",
            "קריאת תורה",
            "קונקורדנציה סטרונג",
            "מגילות קומראן",
            "ברית חדשה דליטש",
            "לימוד עברית מקראית",
            "כלי לימוד כתבי הקודש",
            "אפליקציית דבר",
          ],
        };

        // Determine description based on language
        const description = descriptions[primaryLang] || descriptions.en;
        const keywordContent = (keywords[primaryLang] || keywords.en).join(", ");
        const locale =
          primaryLang === "es"
            ? "es_ES"
            : primaryLang === "he"
              ? "he_IL"
              : "en_US";

        // Get the image URL dynamically
        const imageUrl = window.location.origin + "/og-image.png";

        // Set standard SEO tags
        document
          .getElementById("meta-description")
          .setAttribute("content", description);
        document
          .getElementById("meta-keywords")
          .setAttribute("content", keywordContent);

        // Set Open Graph meta tags
        document
          .getElementById("og-description")
          .setAttribute("content", description);
        document.getElementById("og-image").setAttribute("content", imageUrl);
        document
          .getElementById("og-url")
          .setAttribute("content", window.location.origin);
        document.getElementById("og-locale").setAttribute("content", locale);

        // Set Twitter Card meta tags
        document
          .getElementById("twitter-description")
          .setAttribute("content", description);
        document
          .getElementById("twitter-image")
          .setAttribute("content", imageUrl);

        document
          .getElementById("canonical-url")
          .setAttribute("href", window.location.origin + "/");
      })();
    </script>
