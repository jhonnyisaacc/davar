services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: davar
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: davar_v2_development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - davar_postgres:/var/lib/postgresql/data
volumes:
  davar_postgres:
