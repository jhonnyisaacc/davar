name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      knowledge_suites: ${{ steps.filter.outputs.knowledge == 'true' && '["foundation","davar-compatibility","shaul-compatibility"]' || '["foundation"]' }}
      python: ${{ steps.suites.outputs.python }}
      python_suites: ${{ steps.suites.outputs.python_suites }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/ci/path-filters.yml
      - id: suites
        env:
          FILTERS: ${{ toJson(steps.filter.outputs) }}
        run: python3 scripts/ci/select_suites.py python "$FILTERS" >> "$GITHUB_OUTPUT"

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/ci/branch_name.py "$HEAD_REF"
      - name: Check commits
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" > /tmp/pr-commits.json
          python3 scripts/ci/commit_audit.py /tmp/pr-commits.json
      - name: Gate and routing tests
        run: |
          python3 tests/test_ci_baseline.py
          python3 .github/workflows/lib/which-workflows.py --check
      - name: actionlint
        run: |
          bash -c 'curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.7'
          ./actionlint -color
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: davar_server_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/davar_server_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/davar_server_test
      PGHOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - run: pip install -r .github/ci/requirements.txt
      - working-directory: api
        run: bun install --frozen-lockfile
      - working-directory: api
        run: bun run typecheck
      - working-directory: api
        run: bun run db:migrate
      - working-directory: api
        run: bun test
      - name: Bore calendar tests
        working-directory: api
        run: PYTHONPATH=lib/bore python -m pytest tests/bore -q
      - name: Old-stack names in api
        run: bash scripts/legacy-names.sh

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-web-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-web-${{ runner.os }}-
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bun audit || echo "::warning::Web dependency audit found vulnerabilities"
      - working-directory: web
        run: bun run lint
      - working-directory: web
        run: bun x tsc --noEmit
      - working-directory: web
        run: bun test src/app/services/staticData.loading.test.ts ../scripts/generate-static-data/lexicon-entries.test.ts
      - working-directory: web
        run: bun run build
      - working-directory: web
        run: bun test

  mobile:
    name: mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-mobile-${{ runner.os }}-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: |
            bun-mobile-${{ runner.os }}-
      - name: Install dependencies
        working-directory: mobile
        run: |
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "bun install attempt $attempt/$max_attempts"
            if bun install --frozen-lockfile; then
              echo "bun install succeeded"
              break
            fi
            echo "bun install failed on attempt $attempt"
            rm -rf ~/.bun/install/cache
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "bun install failed after $max_attempts attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done
      - working-directory: mobile
        run: bun audit || echo "::warning::Mobile dependency audit found vulnerabilities"
      - working-directory: mobile
        run: bun run lint
      - working-directory: mobile
        run: bun run test
      - working-directory: mobile
        run: bun run typecheck

  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.changes.outputs.python_suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - run: pip install -r .github/ci/requirements.txt
      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            morphology)
              PYTHONPATH=. python -m pytest -q tests/test_hutter_morphology.py tests/test_hutter_attested_morphology.py
              ;;
            bani)
              python -m pytest -q tools/bani/tests
              python -m tools.bani.audit_phonology
              python -m tools.bani.audit_phonology --language es
              ;;
            translit)
              python -m pytest -q tests/test_translit_benchmark.py tests/test_dss_transformation.py
              python -m scripts.translit.benchmark data/translit/benchmark.json --fail-under 1.0
              ;;
            besorah)
              python -m pytest -q tests/test_besorah_remediation.py tests/test_merge_strongs.py tests/test_delitzsch_review.py
              python -m scripts.delitzsch.review.remediate check
              ;;
            greek-source)
              PYTHONPATH=. python -m pytest -q tests/test_greek_*.py
              ;;
            hutter)
              python -m pytest -q tests/test_hutter_transcription.py
              ;;
            *)
              echo "Unknown python suite: $SUITE" >&2
              exit 1
              ;;
          esac

  knowledge:
    name: knowledge
    needs: changes
    if: needs.changes.outputs.knowledge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.changes.outputs.knowledge_suites) }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      REQUIREMENTS: ${{ matrix.suite == 'shaul-compatibility' && 'davar/.github/ci/requirements.txt' || '.github/ci/requirements.txt' }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.suite != 'shaul-compatibility'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        if: matrix.suite == 'shaul-compatibility'
        with:
          path: davar
      - uses: actions/checkout@v4
        if: matrix.suite == 'shaul-compatibility'
        with:
          repository: jhonnyisaacc/shaul
          ref: 8c94b0fe9eca817e22340430309801d0ef76125b
          path: shaul
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.suite != 'foundation'
        with:
          bun-version: "1.3.14"
      - run: pip install -r "$REQUIREMENTS"
      - name: Knowledge foundation
        if: matrix.suite == 'foundation'
        run: |
          python -m pytest -q tests/test_knowledge_*.py tests/test_commentary_corpus.py
          python -m scripts.knowledge check
      - name: Davar compatibility
        if: matrix.suite == 'davar-compatibility'
        run: |
          python -m scripts.knowledge.compatibility boundary --base "$BASE_SHA"
          bun test tests/fixtures/knowledge/legacy-mapping.test.ts
          python -m scripts.knowledge.compatibility legacy --base "$BASE_SHA"
      - name: Shaul compatibility
        if: matrix.suite == 'shaul-compatibility'
        run: |
          python scripts/test_build_verse_index.py
          mkdir -p "$RUNNER_TEMP/shaul-test-deps"
          bun add --cwd "$RUNNER_TEMP/shaul-test-deps" --ignore-scripts js-yaml@4.1.1
          ln -s "$RUNNER_TEMP/shaul-test-deps/node_modules" node_modules
          bun test scripts/knowledge.test.ts
        working-directory: shaul
      - name: Shaul boundary
        if: matrix.suite == 'shaul-compatibility'
        working-directory: davar
        run: python -m scripts.knowledge.compatibility shaul --shaul-root ../shaul

  dup-code:
    name: dup-code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-dup-${{ runner.os }}-${{ hashFiles('.github/ci/jscpd.json') }}
          restore-keys: |
            bun-dup-${{ runner.os }}-
      - name: Duplicate-code baseline
        run: bash scripts/ci/dup-code.sh

  gate:
    name: gate
    needs: [changes, hygiene, api, web, mobile, python, knowledge, dup-code]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJson(needs) }}
        run: python3 scripts/ci/gate_status.py
