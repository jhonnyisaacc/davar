name: Knowledge foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/biblical-knowledge/**'
      - 'data/knowledge/**'
      - 'scripts/knowledge/**'
      - 'tests/test_knowledge_*'
      - 'tests/fixtures/knowledge/**'
      - 'data/oe/daniel/7.json'
      - 'data/delitzsch_parsed/john/1.json'
      - 'data/greek/preview/**'
      - 'data/tth_2/json/iojanan.json'
      - 'data/dict/lexicon/words.json'
      - 'data/dict/lexicon/custom_definitions.json'
      - '.github/workflows/knowledge-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/biblical-knowledge/**'
      - 'data/knowledge/**'
      - 'scripts/knowledge/**'
      - 'tests/test_knowledge_*'
      - 'tests/fixtures/knowledge/**'
      - 'data/oe/daniel/7.json'
      - 'data/delitzsch_parsed/john/1.json'
      - 'data/greek/preview/**'
      - 'data/tth_2/json/iojanan.json'
      - 'data/dict/lexicon/words.json'
      - 'data/dict/lexicon/custom_definitions.json'
      - '.github/workflows/knowledge-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.26.0 PyYAML==6.0.3 pytest==9.0.2
      - run: python -m pytest -q tests/test_knowledge_*.py
      - run: python -m scripts.knowledge check

  davar-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: pip install jsonschema==4.26.0 PyYAML==6.0.3 pytest==9.0.2 python-dotenv
      - run: python -m scripts.knowledge.compatibility boundary --base "$BASE_SHA"
      - run: bun test tests/fixtures/knowledge/legacy-mapping.test.ts
      - run: python -m pytest -q tests/test_greek_importer.py tests/test_greek_release.py tests/test_merge_strongs.py tests/test_delitzsch_review.py
      - run: python -m scripts.knowledge.compatibility legacy --base "$BASE_SHA"

  shaul-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: davar
      - uses: actions/checkout@v4
        with:
          repository: jhonnyisaacc/shaul
          ref: 8c94b0fe9eca817e22340430309801d0ef76125b
          path: shaul
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: pip install jsonschema==4.26.0 PyYAML==6.0.3
      - run: python scripts/test_build_verse_index.py
        working-directory: shaul
      - name: Install only the existing Shaul YAML test dependency
        run: |
          mkdir -p "$RUNNER_TEMP/shaul-test-deps"
          bun add --cwd "$RUNNER_TEMP/shaul-test-deps" --ignore-scripts js-yaml@4.1.1
          ln -s "$RUNNER_TEMP/shaul-test-deps/node_modules" shaul/node_modules
      - run: bun test scripts/knowledge.test.ts
        working-directory: shaul
      - run: python -m scripts.knowledge.compatibility shaul --shaul-root ../shaul
        working-directory: davar
