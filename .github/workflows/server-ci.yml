name: Davar Server
on:
  pull_request:
    branches: [main, feat/davar-v2]
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  push:
    branches: [main, feat/davar-v2]
    paths: ["server/**", ".github/workflows/server-ci.yml"]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: davar_server_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/davar_server_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/davar_server_test
      PGHOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun test
  bore-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bore calendar tests
        working-directory: server
        run: |
          python -m pip install 'pytest>=8,<10'
          PYTHONPATH=lib/bore python -m pytest tests/bore -q
