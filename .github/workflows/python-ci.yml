name: Python CI

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/hutter/morphology.py"
      - "scripts/hutter/attested_morphology.py"
      - "scripts/hutter/evaluate_attested_morphology.py"
      - "scripts/hutter/map_strongs.py"
      - "tests/test_hutter_morphology.py"
      - "tests/test_hutter_attested_morphology.py"
      - ".github/workflows/python-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/hutter/morphology.py"
      - "scripts/hutter/attested_morphology.py"
      - "scripts/hutter/evaluate_attested_morphology.py"
      - "scripts/hutter/map_strongs.py"
      - "tests/test_hutter_morphology.py"
      - "tests/test_hutter_attested_morphology.py"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run morphology tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_hutter_morphology.py tests/test_hutter_attested_morphology.py -q
