name: Mobile EAS Release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS profile
        required: true
        type: choice
        options:
          - preview
          - production
      platform:
        description: Target platform
        required: true
        type: choice
        options:
          - ios
          - android
          - all
      release_kind:
        description: Release action
        required: true
        default: update
        type: choice
        options:
          - update
          - build
          - build-and-submit

# Production shares `mobile-eas-main` with the automatic EAS workflow so this
# manual run waits instead of publishing production while that workflow is
# already publishing it. Preview keeps a separate group. The older run stays
# alive.
concurrency:
  group: ${{ inputs.profile == 'production' && 'mobile-eas-main' || format('mobile-eas-{0}-{1}-{2}', inputs.profile, inputs.platform, inputs.release_kind) }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  mobile_release:
    name: mobile-eas-release
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile == 'production' && 'mobile-production' || 'mobile-preview' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate release input combination
        run: |
          if [ "${{ inputs.profile }}" != "production" ] && [ "${{ inputs.release_kind }}" = "build-and-submit" ]; then
            echo "build-and-submit is only allowed with production profile"
            exit 1
          fi

      - name: Require the Play service account before Android submit
        if: inputs.release_kind == 'build-and-submit' && inputs.platform != 'ios'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_JSON_ACTION: check
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/play_account.py" << 'PY'
          import json
          import os
          import sys

          raw = os.environ.get("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON", "")
          action = os.environ.get("PLAY_JSON_ACTION", "check")
          if action == "check":
              refused = "eas build and eas submit were not called."
          else:
              refused = "eas submit was not called."

          def fail(message):
              sys.stderr.write(f"::error::{message} {refused}\n")
              sys.exit(1)

          if raw.strip() == "":
              fail(
                  "Repository secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing. "
                  "Android Play submit needs the Play Console service account JSON in that repository secret. "
                  "iOS-only submit does not need it. Update and build do not need it."
              )
          try:
              parsed = json.loads(raw)
          except json.JSONDecodeError:
              fail(
                  "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not valid JSON. "
                  "Save the Play Console service account file contents as that repository secret."
              )
          email = parsed.get("client_email") if isinstance(parsed, dict) else None
          key = parsed.get("private_key") if isinstance(parsed, dict) else None
          if not isinstance(email, str) or email == "" or not isinstance(key, str) or key == "":
              fail(
                  "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not a Google service account key. "
                  "The JSON needs client_email and private_key."
              )
          if action != "write":
              sys.exit(0)

          os.makedirs("secrets", exist_ok=True)
          os.chmod("secrets", 0o700)
          path = "secrets/google-play-service-account.json"
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          try:
              os.write(fd, raw.encode("utf-8"))
          finally:
              os.close(fd)
          os.chmod(path, 0o600)
          PY
          python3 "${RUNNER_TEMP}/play_account.py"

      - name: Install mobile dependencies
        run: |
          cd mobile
          bun install --frozen-lockfile

      - name: Preflight config and environment checks
        run: |
          cd mobile

          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is required for mobile releases"
            exit 1
          fi

          runtime_line="$(grep -E '"runtimeVersion"' app.json || true)"
          if [ -z "$runtime_line" ]; then
            echo "runtimeVersion is missing in mobile/app.json"
            exit 1
          fi

          if echo "$runtime_line" | grep -q '{'; then
            echo "runtimeVersion must be a plain string for bare workflow"
            exit 1
          fi

          required_strict_vars="EXPO_PUBLIC_STATIC_DATA_BASE_URL EXPO_PUBLIC_STATIC_BUNDLES_BASE_URL"
          env_output=""
          env_list_exit=0
          set +e
          env_output="$(eas env:list --environment "${{ inputs.profile }}" 2>&1)"
          env_list_exit=$?
          set -e

          if [ "$env_list_exit" -ne 0 ] || [ -z "$env_output" ]; then
            env_list_error="Failed to read EAS environment '${{ inputs.profile }}' via eas env:list. Verify EXPO_TOKEN permissions and EAS access."
            if [ -n "$env_output" ]; then
              env_list_error="$env_list_error Command output: $env_output"
            fi

            if [ "${{ inputs.profile }}" = "production" ] || [ "${{ inputs.release_kind }}" = "update" ]; then
              echo "$env_list_error"
              exit 1
            fi

            echo "Warning: $env_list_error"
            echo "ENV_PREFLIGHT=warning" >> "$GITHUB_ENV"
            echo "RELEASE_CHANNEL=${{ inputs.profile }}" >> "$GITHUB_ENV"
            echo "RUNTIME_PREFLIGHT=passed" >> "$GITHUB_ENV"
            exit 0
          fi

          missing_strict_vars=""
          for var_name in $required_strict_vars; do
            if ! echo "$env_output" | grep -q "$var_name"; then
              missing_strict_vars="$missing_strict_vars $var_name"
            fi
          done

          env_validation_errors=""
          if [ -n "$missing_strict_vars" ]; then
            env_validation_errors="$env_validation_errors Missing required variables:$missing_strict_vars"
          fi

          if [ -n "$env_validation_errors" ]; then
            if [ "${{ inputs.profile }}" = "production" ]; then
              echo "EAS environment preflight failed for production release."
              echo "$env_validation_errors"
              exit 1
            fi

            if [ "${{ inputs.release_kind }}" = "update" ]; then
              echo "EAS environment preflight failed for update release."
              echo "$env_validation_errors"
              exit 1
            fi

            echo "Warning: EAS environment preflight issues for non-production release:"
            echo "$env_validation_errors"
          fi

          echo "RELEASE_CHANNEL=${{ inputs.profile }}" >> "$GITHUB_ENV"
          echo "RUNTIME_PREFLIGHT=passed" >> "$GITHUB_ENV"
          echo "ENV_PREFLIGHT=passed" >> "$GITHUB_ENV"

      - name: Publish an OTA update
        if: inputs.release_kind == 'update'
        working-directory: mobile
        run: eas update --channel "${{ inputs.profile }}" --environment "${{ inputs.profile }}" --auto --non-interactive

      - name: Build a binary
        if: inputs.release_kind == 'build' || inputs.release_kind == 'build-and-submit'
        working-directory: mobile
        run: |
          if [ "${{ inputs.release_kind }}" = "build" ]; then
            eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --wait
          else
            eas build --platform "${{ inputs.platform }}" --profile production --non-interactive --wait
          fi

      - name: Write the Play service account
        if: inputs.release_kind == 'build-and-submit' && inputs.platform != 'ios'
        working-directory: mobile
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_JSON_ACTION: write
        run: python3 "${RUNNER_TEMP}/play_account.py"

      - name: Submit the binary
        if: inputs.release_kind == 'build-and-submit'
        working-directory: mobile
        run: eas submit --platform "${{ inputs.platform }}" --profile production --latest --non-interactive

      - name: Delete the Play service account
        if: always()
        run: rm -f mobile/secrets/google-play-service-account.json

      - name: Create mobile deployment
        id: create_deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const envName = '${{ inputs.profile }}' === 'production' ? 'mobile-production' : 'mobile-preview';
            const ref = context.sha;
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: envName,
              description: `Mobile ${envName} release (${ '${{ inputs.release_kind }}' })`,
              required_contexts: [],
              auto_merge: false,
              transient_environment: envName !== 'mobile-production',
              production_environment: envName === 'mobile-production',
              payload: JSON.stringify({
                app: 'mobile',
                profile: '${{ inputs.profile }}',
                platform: '${{ inputs.platform }}',
                release_kind: '${{ inputs.release_kind }}',
              }),
            });
            core.setOutput('deployment_id', String(data.id));

      - name: Finalize mobile deployment
        if: always() && steps.create_deployment.outputs.deployment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ steps.create_deployment.outputs.deployment_id }}');
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const envName = '${{ inputs.profile }}' === 'production' ? 'mobile-production' : 'mobile-preview';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state,
              environment: envName,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Mobile release completed' : 'Mobile release failed',
            });

      - name: Summarize release
        if: always()
        run: |
          echo "## Mobile release summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Profile: ${{ inputs.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: ${{ inputs.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: ${RELEASE_CHANNEL:-${{ inputs.profile }}}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: ${{ inputs.release_kind }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime preflight: ${RUNTIME_PREFLIGHT:-failed}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment preflight: ${ENV_PREFLIGHT:-failed}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
