name: Mobile EAS Release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS profile
        required: true
        type: choice
        options:
          - preview
          - production
      platform:
        description: Target platform
        required: true
        type: choice
        options:
          - ios
          - android
          - all
      release_kind:
        description: Release action
        required: true
        default: update
        type: choice
        options:
          - update
          - build
          - build-and-submit

# Production shares `mobile-eas-main` with the automatic EAS workflow so this
# manual run waits instead of publishing production while that workflow is
# already publishing it. Preview keeps a separate group. The older run stays
# alive.
concurrency:
  group: ${{ inputs.profile == 'production' && 'mobile-eas-main' || format('mobile-eas-{0}-{1}-{2}', inputs.profile, inputs.platform, inputs.release_kind) }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  mobile_release:
    name: mobile-eas-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.profile == 'production' && 'mobile-production' || 'mobile-preview' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate release input combination
        run: |
          if [ "${{ inputs.profile }}" != "production" ] && [ "${{ inputs.release_kind }}" = "build-and-submit" ]; then
            echo "build-and-submit is only allowed with production profile"
            exit 1
          fi

      - name: Write Play service account for Android submit
        if: inputs.release_kind == 'build-and-submit' && inputs.platform != 'ios'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          # PLAYCHECK_START
          needs_android_play_json() {
            kind="$1"
            platform="$2"
            [ "${kind}" = "build-and-submit" ] || return 1
            [ "${platform}" != "ios" ]
          }

          check_play_json() {
            file="$1"
            if [ ! -f "${file}" ]; then
              echo "::error::Missing ${file}. Android submit needs the Play service account JSON. eas submit was not called."
              return 1
            fi
            if ! python3 -c '
          import json, sys
          path = sys.argv[1]
          try:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
          except Exception:
              sys.stderr.write("Play service account file is not valid JSON. eas submit was not called.\n")
              sys.exit(1)
          if not isinstance(data, dict):
              sys.stderr.write("Play service account JSON must be an object. eas submit was not called.\n")
              sys.exit(1)
          if data.get("type") != "service_account":
              sys.stderr.write("Play service account JSON must have type service_account. eas submit was not called.\n")
              sys.exit(1)
          for key in ("client_email", "private_key"):
              value = data.get(key)
              if not isinstance(value, str) or not value.strip():
                  sys.stderr.write("Play service account JSON is missing %s. eas submit was not called.\n" % key)
                  sys.exit(1)
          ' "${file}"
            then
              echo "::error::Play service account JSON failed validation. eas submit was not called."
              return 1
            fi
            mode="$(stat -c '%a' "${file}")"
            if [ "${mode}" != "600" ]; then
              echo "::error::${file} mode is ${mode}, expected 600. eas submit was not called."
              return 1
            fi
          }

          write_play_json() {
            if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
              echo "::error::Repository secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing. Android submit needs it. eas build and eas submit were not called."
              return 1
            fi
            mkdir -p mobile/secrets
            umask 077
            printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" > mobile/secrets/google-play-service-account.json
            chmod 600 mobile/secrets/google-play-service-account.json
            check_play_json mobile/secrets/google-play-service-account.json
          }
          # PLAYCHECK_END
          if needs_android_play_json "${RELEASE_KIND}" "${RELEASE_PLATFORM}"; then
            write_play_json
          fi

      - name: Record the App Store Connect gap
        if: inputs.release_kind == 'build-and-submit' && (inputs.platform == 'ios' || inputs.platform == 'all')
        run: |
          echo "iOS submit uses the App Store Connect API key stored on EAS project 232e7627-d0c9-4b88-976e-b4855beb322e."
          echo "An iOS-only submit runs without the Play service account JSON."
          echo "A missing App Store Connect API key on that EAS project fails eas submit for iOS."

      - name: Install mobile dependencies
        run: |
          cd mobile
          bun install --frozen-lockfile

      - name: Preflight config and environment checks
        run: |
          cd mobile

          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is required for mobile releases"
            exit 1
          fi

          runtime_line="$(grep -E '"runtimeVersion"' app.json || true)"
          if [ -z "$runtime_line" ]; then
            echo "runtimeVersion is missing in mobile/app.json"
            exit 1
          fi

          if echo "$runtime_line" | grep -q '{'; then
            echo "runtimeVersion must be a plain string for bare workflow"
            exit 1
          fi

          required_strict_vars="EXPO_PUBLIC_STATIC_DATA_BASE_URL EXPO_PUBLIC_STATIC_BUNDLES_BASE_URL"
          env_output=""
          env_list_exit=0
          set +e
          env_output="$(eas env:list --environment "${{ inputs.profile }}" 2>&1)"
          env_list_exit=$?
          set -e

          if [ "$env_list_exit" -ne 0 ] || [ -z "$env_output" ]; then
            env_list_error="Failed to read EAS environment '${{ inputs.profile }}' via eas env:list. Verify EXPO_TOKEN permissions and EAS access."
            if [ -n "$env_output" ]; then
              env_list_error="$env_list_error Command output: $env_output"
            fi

            if [ "${{ inputs.profile }}" = "production" ] || [ "${{ inputs.release_kind }}" = "update" ]; then
              echo "$env_list_error"
              exit 1
            fi

            echo "Warning: $env_list_error"
            echo "ENV_PREFLIGHT=warning" >> "$GITHUB_ENV"
            echo "RELEASE_CHANNEL=${{ inputs.profile }}" >> "$GITHUB_ENV"
            echo "RUNTIME_PREFLIGHT=passed" >> "$GITHUB_ENV"
            exit 0
          fi

          missing_strict_vars=""
          for var_name in $required_strict_vars; do
            if ! echo "$env_output" | grep -q "$var_name"; then
              missing_strict_vars="$missing_strict_vars $var_name"
            fi
          done

          env_validation_errors=""
          if [ -n "$missing_strict_vars" ]; then
            env_validation_errors="$env_validation_errors Missing required variables:$missing_strict_vars"
          fi

          if [ -n "$env_validation_errors" ]; then
            if [ "${{ inputs.profile }}" = "production" ]; then
              echo "EAS environment preflight failed for production release."
              echo "$env_validation_errors"
              exit 1
            fi

            if [ "${{ inputs.release_kind }}" = "update" ]; then
              echo "EAS environment preflight failed for update release."
              echo "$env_validation_errors"
              exit 1
            fi

            echo "Warning: EAS environment preflight issues for non-production release:"
            echo "$env_validation_errors"
          fi

          if [ "${{ inputs.release_kind }}" = "build-and-submit" ] && [ "${{ inputs.platform }}" != "ios" ]; then
            if [ ! -f "./secrets/google-play-service-account.json" ]; then
              echo "::error::Missing mobile/secrets/google-play-service-account.json. Android submit needs it. eas submit was not called."
              exit 1
            fi
          fi

          echo "RELEASE_CHANNEL=${{ inputs.profile }}" >> "$GITHUB_ENV"
          echo "RUNTIME_PREFLIGHT=passed" >> "$GITHUB_ENV"
          echo "ENV_PREFLIGHT=passed" >> "$GITHUB_ENV"

      - name: Execute EAS release action
        run: |
          cd mobile

          if [ "${{ inputs.release_kind }}" = "update" ]; then
            eas update --channel "${{ inputs.profile }}" --environment "${{ inputs.profile }}" --auto --non-interactive
          elif [ "${{ inputs.release_kind }}" = "build" ]; then
            eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --wait
          else
            eas build --platform "${{ inputs.platform }}" --profile production --non-interactive --wait
            eas submit --platform "${{ inputs.platform }}" --profile production --latest --non-interactive
          fi

      - name: Remove Play service account
        if: always()
        run: rm -f mobile/secrets/google-play-service-account.json

      - name: Create mobile deployment
        id: create_deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const envName = '${{ inputs.profile }}' === 'production' ? 'mobile-production' : 'mobile-preview';
            const ref = context.sha;
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: envName,
              description: `Mobile ${envName} release (${ '${{ inputs.release_kind }}' })`,
              required_contexts: [],
              auto_merge: false,
              transient_environment: envName !== 'mobile-production',
              production_environment: envName === 'mobile-production',
              payload: JSON.stringify({
                app: 'mobile',
                profile: '${{ inputs.profile }}',
                platform: '${{ inputs.platform }}',
                release_kind: '${{ inputs.release_kind }}',
              }),
            });
            core.setOutput('deployment_id', String(data.id));

      - name: Finalize mobile deployment
        if: always() && steps.create_deployment.outputs.deployment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ steps.create_deployment.outputs.deployment_id }}');
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const envName = '${{ inputs.profile }}' === 'production' ? 'mobile-production' : 'mobile-preview';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state,
              environment: envName,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Mobile release completed' : 'Mobile release failed',
            });

      - name: Summarize release
        if: always()
        run: |
          echo "## Mobile release summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Profile: ${{ inputs.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: ${{ inputs.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: ${RELEASE_CHANNEL:-${{ inputs.profile }}}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: ${{ inputs.release_kind }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime preflight: ${RUNTIME_PREFLIGHT:-failed}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment preflight: ${ENV_PREFLIGHT:-failed}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
