name: Davar API
on:
  pull_request:
    branches: [main]
    paths: ["api/**", "shared/product*.ts", "contracts/biblical-knowledge/**", "data/knowledge/registries/**", ".github/workflows/davar-api-ci.yml"]
  push:
    branches: [main]
    paths: ["api/**", "shared/product*.ts", "contracts/biblical-knowledge/**", "data/knowledge/registries/**", ".github/workflows/davar-api-ci.yml"]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.9"
          bundler-cache: true
          working-directory: api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: bundle exec rails db:prepare
      - run: bundle exec rails zeitwerk:check
      - run: bundle exec rails test
      - run: PYTHONPATH=lib/bore python -m pytest test/bore -q
