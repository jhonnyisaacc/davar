name: Davar API
on:
  pull_request:
    branches: [main, feat/davar-v2, feat/preview-api-railway]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - "shared/product*.ts"
      - "contracts/biblical-knowledge/**"
      - "data/knowledge/registries/**"
  push:
    branches: [main, feat/davar-v2]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - "shared/product*.ts"
      - "contracts/biblical-knowledge/**"
      - "data/knowledge/registries/**"
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: davar_server_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/davar_server_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/davar_server_test
      PGHOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun test
  bore-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bore calendar tests
        working-directory: api
        run: |
          python -m pip install 'pytest>=8,<10'
          PYTHONPATH=lib/bore python -m pytest tests/bore -q
