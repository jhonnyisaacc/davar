name: Web CI

on:
  push:
    branches: [main]
    paths: ["web/**", "shared/**", "scripts/generate-static-data/**", ".github/workflows/web-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["web/**", "shared/**", "scripts/generate-static-data/**", ".github/workflows/web-ci.yml"]

permissions:
  contents: read
  deployments: write

jobs:
  web_ci:
    name: web-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create development deployment
        id: create_deployment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: 'development',
              description: `Web PR #${prNumber} validation`,
              required_contexts: [],
              auto_merge: false,
              transient_environment: true,
              production_environment: false,
              payload: JSON.stringify({ app: 'web', pr: prNumber }),
            });
            core.setOutput('deployment_id', String(data.id));

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: |
          cd web
          bun install

      - name: Run lint
        run: |
          cd web
          bun run lint

      - name: Run static-data loader tests
        run: |
          cd web
          bun test src/app/services/staticData.loading.test.ts ../scripts/generate-static-data/lexicon-entries.test.ts

      - name: Run build
        run: |
          cd web
          bun run build

      - name: Finalize development deployment
        if: always() && github.event_name == 'pull_request' && steps.create_deployment.outputs.deployment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ steps.create_deployment.outputs.deployment_id }}');
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Web PR checks passed' : 'Web PR checks failed',
            });
