name: Greek source quality
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/greek/**"
      - "tests/test_greek_*.py"
      - "tests/fixtures/greek/**"
      - "docs/greek-besorah-source-licenses.md"
      - ".github/workflows/greek-source-quality.yml"
  push:
    branches: [main]
    paths:
      - "scripts/greek/**"
      - "tests/test_greek_*.py"
      - "tests/fixtures/greek/**"
      - "docs/greek-besorah-source-licenses.md"
      - ".github/workflows/greek-source-quality.yml"
permissions:
  contents: read
jobs:
  greek-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_greek_tagnt_edition.py tests/test_greek_importer.py tests/test_greek_definitions.py
        env:
          PYTHONPATH: .
