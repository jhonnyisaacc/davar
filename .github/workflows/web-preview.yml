name: Web Preview

on:
  pull_request:
    types: [ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy_preview:
    name: web-preview
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Require preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing GitHub secrets CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Build web
        working-directory: web
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
        run: |
          if [ -z "${PUBLIC_API_URL:-}" ]; then
            echo "Missing GitHub secret PUBLIC_API_URL"
            exit 1
          fi
          touch .env
          bun run build

      - name: Deploy preview
        id: deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$PREVIEW_BRANCH" = "main" ]; then
            echo "Refusing to deploy the production branch"
            exit 1
          fi
          DEPLOY_LOG=$(mktemp)
          bunx wrangler@3.114.17 pages deploy dist \
            --project-name davar \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$PREVIEW_SHA" | tee "$DEPLOY_LOG"
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' "$DEPLOY_LOG" | awk '!seen[$0]++' | tail -n 1)
          if [ -z "$URL" ]; then
            echo "Preview URL missing from wrangler output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post preview URL
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const marker = "<!-- davar-web-preview -->";
            const url = process.env.PREVIEW_URL;
            const branch = process.env.PREVIEW_BRANCH;
            const sha = process.env.PREVIEW_SHA;
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: "open",
              });
              prNumber = prs[0]?.number;
            }
            if (!prNumber) {
              core.warning("No open pull request to comment on");
              return;
            }
            const body = `${marker}\nPreview: ${url}\n\nBranch \`${branch}\` at \`${sha}\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
