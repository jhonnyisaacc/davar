description: Un concepto experimental que reúne formas lingüísticas y menciones intertextuales sin borrar su especificidad léxica.
summary:
  what_it_is: >-
    Hijo del Hombre reúne el בן האדם — Ben HaAdam de Marcos con el בר אנש — Bar
    Enash de Daniel 7. Daniel ve a uno como hijo de hombre después de las bestias
    y le son dados dominio, honra y reino; Marcos une el Ben HaAdam con
    padecimiento, muerte, resurrección y venida en nubes. El concepto también se
    lee dentro de la pregunta adámica: el Mesías es el Hombre de arriba, en quien
    la vocación y el dominio destinados al hombre llegan a su cumplimiento.
  what_it_is_not: >-
    No es simplemente una manera de decir que Yeshua era humano, ni una etiqueta
    que pueda separarse de Daniel 7, del reino, del padecimiento y de la
    resurrección. Tampoco es correcto convertir בן — ben en «heredero» o
    «repartidor» como si esa fuera su traducción fija en todas sus apariciones;
    las notas presentan esa relación como una lectura contextual y pedagógica.
